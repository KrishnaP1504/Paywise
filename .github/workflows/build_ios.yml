name: Build Free iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA (Free Sideloading)
    runs-on: macos-15
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager for Stable CocoaPods Build
        run: flutter config --no-enable-swift-package-manager

      - name: Get Flutter Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Show Detailed Error if Build Fails
        if: failure()
        run: |
          if [ -f "build/xcodebuild.log" ]; then
            echo "=== Last 150 lines of xcodebuild.log ==="
            tail -n 150 build/xcodebuild.log
          fi

      - name: Package Payload into Installable IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PayWise.ipa Payload
          echo "PayWise.ipa created successfully!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayWise-iOS-IPA
          path: PayWise.ipa
          retention-days: 14
