name: Build Free iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA (Free Sideloading)
    runs-on: macos-14
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Select Xcode with Bundled iOS SDK
        run: |
          echo "=== Available Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "No Xcode apps found"
          
          # Prefer Xcode 16.0 on macos-14 (has bundled iOS SDK)
          # Fall back through available versions
          SELECTED=""
          for xc in /Applications/Xcode_16.0.app /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              sudo xcode-select -s "$xc"
              SELECTED="$xc"
              break
            fi
          done
          
          echo "=== Selected: $SELECTED ==="
          xcodebuild -version
          
          echo "=== Available iOS SDKs ==="
          xcodebuild -showsdks 2>&1 | grep -i ios || echo "No iOS SDKs listed"
          
          echo "=== iOS SDK Path ==="
          xcrun --sdk iphoneos --show-sdk-path 2>&1 || echo "Cannot resolve iphoneos SDK path"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager for Stable CocoaPods Build
        run: flutter config --no-enable-swift-package-manager

      - name: Get Flutter Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Show Detailed Error if Build Fails
        if: failure()
        run: |
          echo "=== Environment Debug Info ==="
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path 2>&1 || true
          echo "=== Last 200 lines of build log ==="
          find build -name "*.log" -exec tail -n 200 {} \; 2>/dev/null || echo "No log files found"

      - name: Package Payload into Installable IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PayWise.ipa Payload
          echo "PayWise.ipa created successfully!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayWise-iOS-IPA
          path: PayWise.ipa
          retention-days: 14
