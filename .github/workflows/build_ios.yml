name: Build Free iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA (Free Sideloading)
    runs-on: macos-14
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Installable IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PayWise.ipa Payload
          echo "PayWise.ipa created successfully!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayWise-iOS-IPA
          path: PayWise.ipa
          retention-days: 14
