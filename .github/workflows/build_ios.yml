name: Build Free iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA (Free Sideloading)
    runs-on: macos-15
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 (Default, has iOS SDK + Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Initialize iOS Platform & Verify SDK
        run: |
          echo "=== Xcode Version ==="
          xcodebuild -version

          echo "=== Accept License ==="
          sudo xcodebuild -license accept

          echo "=== Initialize Simulator Environment ==="
          xcrun simctl list > /dev/null 2>&1 || true

          echo "=== Available SDKs ==="
          xcodebuild -showsdks

          echo "=== iOS SDK Path ==="
          xcrun --sdk iphoneos --show-sdk-path || echo "WARNING: iphoneos SDK not found"

          echo "=== Swift Version ==="
          swift --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager for Stable CocoaPods Build
        run: flutter config --no-enable-swift-package-manager

      - name: Get Flutter Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Show Detailed Error if Build Fails
        if: failure()
        run: |
          echo "=== Environment Debug ==="
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path 2>&1 || true
          echo "=== Available Destinations ==="
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -showdestinations 2>&1 || true
          echo "=== Last 200 lines of build log ==="
          find build -name "*.log" -exec tail -n 200 {} \; 2>/dev/null || echo "No log files found"

      - name: Package Payload into Installable IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PayWise.ipa Payload
          echo "PayWise.ipa created successfully!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayWise-iOS-IPA
          path: PayWise.ipa
          retention-days: 14
