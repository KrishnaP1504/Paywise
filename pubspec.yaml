name: paywise
description: A new Flutter project.
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  table_calendar: ^3.0.9
  local_auth: ^2.1.6
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  intl: ^0.18.1
  fl_chart: ^0.69.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  flutter_launcher_icons: ^0.13.1
  # NEW PACKAGES
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  pdf: ^3.10.4
  printing: ^5.11.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/paywise_logo.png

flutter_launcher_icons:
  image_path: "assets/images/paywise_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/paywise_logo.png"
